<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0F1B2D"/>
  <!-- water lines -->
  <path d="M40 470c36 0 36-14 72-14s36 14 72 14 36-14 72-14 36 14 72 14 36-14 72-14 36 14 72 14" fill="none" stroke="#1D4E89" stroke-width="10" stroke-linecap="round"/>
  <!-- stopwatch crown + side button -->
  <rect x="246" y="104" width="20" height="30" rx="4" fill="#FFFFFF"/>
  <rect x="220" y="80" width="72" height="30" rx="10" fill="#FFFFFF"/>
  <rect x="368" y="138" width="22" height="40" rx="6" fill="#FFFFFF" transform="rotate(45 379 158)"/>
  <!-- ring track + countdown arc -->
  <circle cx="256" cy="288" r="148" fill="none" stroke="#24456F" stroke-width="30"/>
  <circle cx="256" cy="288" r="148" fill="none" stroke="#F07A3E" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="650 1000" transform="rotate(-90 256 288)"/>
  <!-- tick marks -->
  <g stroke="#B9C6D6" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="176" x2="256" y2="194"/>
    <line x1="368" y1="288" x2="350" y2="288"/>
    <line x1="256" y1="400" x2="256" y2="382"/>
    <line x1="144" y1="288" x2="162" y2="288"/>
  </g>
  <!-- oar as the watch hand -->
  <g transform="rotate(-38 256 288)">
    <rect x="248" y="196" width="16" height="104" rx="8" fill="#FFFFFF"/>
    <path d="M250 206 C246 176 250 140 262 126 C276 112 292 124 292 150 C292 180 280 200 264 210 Z" fill="#FFFFFF"/>
  </g>
  <circle cx="256" cy="288" r="20" fill="#FFFFFF"/>
  <circle cx="256" cy="288" r="8" fill="#F07A3E"/>
</svg>
